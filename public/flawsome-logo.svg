<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 550" width="100%" height="100%">
  <defs>
    <!-- Silver-Lavender Crescent Moon Gradient -->
    <linearGradient id="moonGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFE8F5" />
      <stop offset="40%" stop-color="#D8C8E8" />
      <stop offset="80%" stop-color="#BBA7CE" />
      <stop offset="100%" stop-color="#A48CB8" />
    </linearGradient>

    <!-- Deep Plum Dancer Body Gradient -->
    <linearGradient id="bodyGradient" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#6C2274" />
      <stop offset="50%" stop-color="#4A1252" />
      <stop offset="100%" stop-color="#2A0631" />
    </linearGradient>

    <!-- Skirt Feather Plumes Gradients (Plum to Vivid Magenta Tips) -->
    <linearGradient id="plumeGradient1" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#3B0C42" />
      <stop offset="45%" stop-color="#631B6E" />
      <stop offset="85%" stop-color="#A22A9F" />
      <stop offset="100%" stop-color="#C838B8" />
    </linearGradient>

    <linearGradient id="plumeGradient2" x1="0%" y1="0%" x2="40%" y2="100%">
      <stop offset="0%" stop-color="#4A1252" />
      <stop offset="50%" stop-color="#75207C" />
      <stop offset="88%" stop-color="#B230B0" />
      <stop offset="100%" stop-color="#D442C4" />
    </linearGradient>
  </defs>

  <!-- 1. CRESCENT MOON -->
  <path
    d="M 240 15
       C 150 60 95 165 135 270
       C 160 335 228 375 322 338
       C 244 368 172 332 152 268
       C 122 178 170 88 240 15 Z"
    fill="url(#moonGradient)"
  />

  <!-- 2. DANCER SILHOUETTE & UPPER BODY -->
  <g fill="url(#bodyGradient)">
    <!-- Arm extending to top tip of moon -->
    <path
      d="M 240 15
         C 235 34 228 68 218 100
         C 230 90 245 80 262 72
         C 292 62 328 78 344 82
         C 332 92 302 102 272 112
         C 250 120 232 105 220 92
         C 210 75 202 50 210 30
         C 220 20 232 15 240 15 Z"
    />

    <!-- Head profile thrown back, facing up-right -->
    <path
      d="M 230 75
         C 235 58 252 53 268 58
         C 282 63 285 78 275 85
         C 290 92 306 102 315 122
         C 298 115 285 104 268 93
         C 278 110 285 130 290 147
         C 275 135 262 118 250 100
         C 240 108 230 95 230 75 Z"
    />

    <!-- Torso arching back -->
    <path
      d="M 210 98
         C 190 128 182 162 188 196
         C 198 174 212 152 228 130
         C 235 113 228 100 210 98 Z"
    />
  </g>

  <!-- 3. THE 5 FLOWERING DRESS FEATHER PLUMES WITH MAGENTA TIPS -->
  <path
    d="M 190 184
       C 218 223 265 280 335 316
       C 308 292 262 240 222 194 Z"
    fill="url(#plumeGradient1)"
  />

  <path
    d="M 188 191
       C 210 242 255 316 325 374
       C 294 333 250 267 215 208 Z"
    fill="url(#plumeGradient2)"
  />

  <path
    d="M 185 198
       C 200 257 238 346 306 427
       C 278 378 235 292 202 218 Z"
    fill="url(#plumeGradient1)"
  />

  <path
    d="M 182 205
       C 192 272 220 378 285 481
       C 260 420 222 318 192 228 Z"
    fill="url(#plumeGradient2)"
  />

  <path
    d="M 180 213
       C 185 284 205 404 260 533
       C 240 460 210 350 185 238 Z"
    fill="url(#plumeGradient1)"
  />
</svg>
